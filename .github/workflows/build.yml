name: Build Plugins

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Build Plugin
        run: |
          mkdir -p build
          echo "Compiling Flemmix Plugin..."
          zip -r build/Flemmix.jar src/ gradle.properties
        continue-on-error: false

      - name: Generate Repo JSON
        run: |
          echo '[
            {
              "name": "Flemmix",
              "version": 1,
              "description": "Extension pour regarder Flemmix sur CloudStream",
              "url": "https://githubusercontent.com{{ github.repository }}/main/build/Flemmix.jar"
            }
          ]' > build/repo.json
        continue-on-error: false

      - name: Save and Commit Files to Main
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add build/Flemmix.jar build/repo.json
          git commit -m "Publish Flemmix and repo.json [skip ci]" --allow-empty
          git push origin main
